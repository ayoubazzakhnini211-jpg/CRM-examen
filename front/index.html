<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <h2 id="hello">Hello from le front, Ayoub Azzakhnini</h2>
      <p id="test-message" class="test-message"></p>

      <h1>CRM — Clients</h1>
      <p id="status" class="status"></p>

      <form id="client-form">
        <input id="nom" placeholder="Nom" required />
        <input id="email" type="email" placeholder="Email" required />
        <input id="telephone" placeholder="Téléphone" />
        <button type="submit">Ajouter</button>
      </form>

      <table>
        <thead>
          <tr><th>Nom</th><th>Email</th><th>Téléphone</th><th></th></tr>
        </thead>
        <tbody id="clients"></tbody>
      </table>
    </main>
    <script src="js/app.js"></script>
  </body>
</html>
